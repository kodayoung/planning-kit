# 기획 건 목록. 링크 하나 안에서 이 목록을 갈아탑니다.
#
# 기획 건마다 프론트 갈래가 다릅니다. 갈래가 다르면 화면 자체가 다른 프로그램이라
# 통째로 갈아끼워야 합니다. 그래서 건마다 주소 아래 자기 자리를 하나씩 받고,
# 화면 위 툴바에서 옮겨 다닙니다.
#
#   slug   주소에 쓰일 이름. 영문·숫자·하이픈만. 바꾸면 링크가 바뀝니다
#   title  툴바에 보일 이름
#   repo   그 갈래가 체크아웃된 워크트리 경로
#   start  이 건을 고르면 열릴 화면
#
# 여기 적고 `npm run bundle` 을 하면 각 갈래를 알아서 빌드해 넣습니다.
# 워크트리에 pnpm install 이 안 돼 있으면 그 건만 건너뛰고 알려줍니다.

- slug: develop
  title: 지금 제품 (develop)
  repo: C:/경로/프론트-레포
  start: /

