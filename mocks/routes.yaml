# 목업 규칙. 위에서부터 먼저 맞는 것 하나가 쓰입니다.
#
#   name    콘솔에 찍힐 이름 (아무거나)
#   method  GET / POST / PUT / DELETE
#   path    브라우저가 실제로 보내는 경로. 끝에 * 를 붙이면 "이걸로 시작하는 전부"
#   file    mocks/ 아래 응답 JSON 파일 경로. 없으면 빈 응답
#   status  응답 코드 (기본 200). 500 으로 바꾸면 에러 화면을 볼 수 있습니다
#   delay   응답을 늦출 시간(ms). 3000 으로 바꾸면 로딩 화면을 볼 수 있습니다
#   enabled false 로 두면 이 규칙을 끕니다 (지우지 않고 잠깐 꺼둘 때)
#
# 이 파일은 저장하면 바로 반영됩니다. 서버를 다시 켜지 않아도 됩니다.
# YAML 을 잘못 고쳐도 서버는 안 죽고, 콘솔에 몇 번째 줄이 잘못됐는지 알려줍니다.
#
# ── 공유 링크에서는 ──
# 같은 method + path 에 여러 개를 적어두면 한 묶음이 되어, 링크를 받은 사람이
# 화면 위 툴바에서 직접 골라 볼 수 있습니다. enabled 는 "처음에 뭘 보여줄까"가 됩니다.
# 그래서 실패 화면을 보여주려고 다시 구워 올릴 필요가 없습니다.
#
#   name 에 가운뎃점을 쓰면 앞이 묶음 이름, 뒤가 경우 이름이 됩니다.
#     "공지 목록 · 성공"  →  묶음 "공지 목록", 경우 "성공"

# ─────────────────────────────────────────────────────────────
# 예시 — 가상의 "공지 목록" API.
# 같은 주소로 성공 · 빈 목록 · 서버 오류 · 느린 응답을 적어두고 "한 번에 하나만" 켭니다.
# 위에서부터 먼저 맞는 것이 이기므로, 보고 싶은 경우만 true 로 두세요.
# ─────────────────────────────────────────────────────────────

- name: 공지 목록 · 성공
  method: GET
  path: /api/example/notices
  file: example/notices.json
  status: 200
  delay: 0
  enabled: true

- name: 공지 목록 · 빈 목록
  method: GET
  path: /api/example/notices
  file: example/notices-empty.json
  status: 200
  enabled: false

- name: 공지 목록 · 서버 오류
  method: GET
  path: /api/example/notices
  file: example/error.json
  status: 500
  enabled: false

- name: 공지 목록 · 로딩 3초
  method: GET
  path: /api/example/notices
  file: example/notices.json
  delay: 3000
  enabled: false

# ─────────────────────────────────────────────────────────────
# 목업 장치가 살아있는지 확인하는 용도. 브라우저에서 localhost:4000/api/_smoke 를 열면
# {"ok": true} 가 보여야 합니다. 실제 백엔드에는 없는 주소라 켜둬도 아무 영향 없습니다.
- name: 장치 점검용
  method: GET
  path: /api/_smoke
  file: _smoke/ping.json
  status: 200
  delay: 0
  enabled: true
